name: UI E2E

on:
  push:
    branches: [ado/spanish-codex-tutor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-and-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAIWA_E2E_CHANNEL: chromium
      KAIWA_E2E_PYTHON: python
      KAIWA_DEPLOYMENT: local
    steps:
      - name: Configure isolated runtime paths
        run: |
          printf 'KAIWA_PLAYWRIGHT_ROOT=%s/kaiwa-playwright/node_modules\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/kaiwa-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KAIWA_E2E_ARTIFACTS=%s/kaiwa-ui-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kaiwa-playwright" --no-save --no-package-lock playwright@1.62.1
          cd "$RUNNER_TEMP/kaiwa-playwright"
          npx --no-install playwright install chromium --with-deps
      - name: Run isolated UI and Amadeus E2E
        run: node tests/e2e/ci-run.mjs
      - name: Upload report, traces and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kaiwa-ui-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kaiwa-ui-evidence/report/
            ${{ runner.temp }}/kaiwa-ui-evidence/results/
            ${{ runner.temp }}/kaiwa-ui-evidence/result.json
            ${{ runner.temp }}/kaiwa-ui-evidence/server.log
            ${{ runner.temp }}/kaiwa-ui-evidence/run.json
