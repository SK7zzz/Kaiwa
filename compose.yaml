name: kaiwa-private

services:
  kaiwa:
    image: kaiwa:${KAIWA_IMAGE_TAG:-local}
    build:
      context: .
      args:
        CODEX_VERSION: "0.159.3"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    environment:
      KAIWA_DEPLOYMENT: production
      TZ: Asia/Tokyo
      KAIWA_PUBLIC_ORIGIN: ${KAIWA_PUBLIC_ORIGIN:?Set the HTTPS origin}
      KAIWA_AUTH_PROVIDER: ${KAIWA_AUTH_PROVIDER:-tailscale}
      KAIWA_TAILSCALE_LOGIN: ${KAIWA_TAILSCALE_LOGIN:?Set the single Tailscale user login}
      KAIWA_PROXY_SECRET_FILE: /run/secrets/proxy-secret
      KAIWA_VOICEVOX_URL: http://voicevox:50021
    volumes:
      - kaiwa-data:/app/data
      - kaiwa-codex:/home/kaiwa/.codex
      - kaiwa-backups:/home/kaiwa/Documents/Kaiwa Backups
    expose: ["8130"]
    secrets: [proxy-secret]
    networks: [kaiwa-egress, kaiwa-speech, kaiwa-proxy]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  voicevox:
    image: ${KAIWA_VOICEVOX_IMAGE:?Set the pinned official CPU image with digest}
    user: "1000:1000"
    entrypoint: [/opt/voicevox_engine/run]
    command: [--host, 0.0.0.0]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["50021"]
    networks: [kaiwa-speech]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  tailscale-proxy:
    image: ${KAIWA_PROXY_IMAGE:?Set the pinned official nginx image with digest}
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [nginx]
    command: [-g, "daemon off;", -c, /etc/nginx/nginx.conf]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=0700
    configs:
      - source: tailscale-proxy-config
        target: /etc/nginx/nginx.conf
    ports: ["127.0.0.1:18130:8080"]
    networks: [kaiwa-ingress, kaiwa-proxy]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      kaiwa:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  kaiwa-ingress:
    driver: bridge
  kaiwa-egress:
    driver: bridge
  kaiwa-speech:
    driver: bridge
    internal: true
  kaiwa-proxy:
    driver: bridge
    internal: true

volumes:
  kaiwa-data:
    name: kaiwa-data
  kaiwa-codex:
    name: kaiwa-codex
  kaiwa-backups:
    name: kaiwa-backups

configs:
  tailscale-proxy-config:
    file: ${KAIWA_PROXY_CONFIG_FILE:?Set the absolute private nginx configuration path}

secrets:
  proxy-secret:
    file: ${KAIWA_PROXY_SECRET_FILE:?Set the absolute private proxy secret path}
