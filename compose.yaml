name: kaiwa-private

services:
  kaiwa:
    image: kaiwa:${KAIWA_IMAGE_TAG:-local}
    build:
      context: .
      args:
        CODEX_VERSION: "0.159.3"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    environment:
      KAIWA_DEPLOYMENT: production
      TZ: Asia/Tokyo
      KAIWA_PUBLIC_ORIGIN: ${KAIWA_PUBLIC_ORIGIN:?Set the HTTPS origin}
      KAIWA_ACCESS_TEAM_DOMAIN: ${KAIWA_ACCESS_TEAM_DOMAIN:?Set the Cloudflare team domain}
      KAIWA_ACCESS_AUD: ${KAIWA_ACCESS_AUD:?Set the Access application audience}
      KAIWA_ALLOWED_EMAIL: ${KAIWA_ALLOWED_EMAIL:?Set the single allowed email}
      KAIWA_VOICEVOX_URL: http://voicevox:50021
    volumes:
      - kaiwa-data:/app/data
      - kaiwa-codex:/home/kaiwa/.codex
      - kaiwa-backups:/home/kaiwa/Documents/Kaiwa Backups
    expose: ["8130"]
    networks: [kaiwa-egress, kaiwa-speech]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  voicevox:
    image: ${KAIWA_VOICEVOX_IMAGE:?Set the pinned official CPU image with digest}
    user: "1000:1000"
    entrypoint: [/opt/voicevox_engine/run]
    command: [--host, 0.0.0.0]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["50021"]
    networks: [kaiwa-speech]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set a pinned official cloudflared image with digest}
    user: "65532:65532"
    profiles: [tunnel]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    configs:
      - source: tunnel-config
        target: /etc/cloudflared/config.yml
    secrets: [tunnel-credentials]
    networks: [kaiwa-egress]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      kaiwa:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  kaiwa-egress:
    driver: bridge
  kaiwa-speech:
    driver: bridge
    internal: true

volumes:
  kaiwa-data:
    name: kaiwa-data
  kaiwa-codex:
    name: kaiwa-codex
  kaiwa-backups:
    name: kaiwa-backups

configs:
  tunnel-config:
    file: ${KAIWA_TUNNEL_CONFIG_FILE:?Set the absolute private tunnel configuration path}

secrets:
  tunnel-credentials:
    file: ${KAIWA_TUNNEL_CREDENTIALS_FILE:?Set the absolute private tunnel credentials JSON path}
